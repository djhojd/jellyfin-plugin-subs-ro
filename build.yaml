version: "1.1.0.0"
targetAbi: "12.4.0.0"
framework: "net10.0"
overview: "Download Romanian subtitles from subs.ro"
description: >
  Subtitle provider that downloads Romanian (RO) subtitles from subs.ro for
  movies that are missing them. Configure Romanian as a subtitle download
  language on your movie library to use it.
category: "Subtitles"
owner: "djhojd"
artifacts:
- "Jellyfin.Plugin.SubsRo.dll"
- "AngleSharp.dll"
- "SharpCompress.dll"
changelog: |
  - Targets Jellyfin 12.4.
  - Automatic downloads skip videos that already have an untagged or Romanian subtitle file next to them.
  - Optional subs.ro API key, release-name matching and TV episode support.
