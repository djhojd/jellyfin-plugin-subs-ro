name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      # Release is the shipped configuration; analyzer warnings fail it.
      - name: Build
        run: dotnet build Jellyfin.Plugin.SubsRo/Jellyfin.Plugin.SubsRo.csproj --configuration Release

      - name: Unit tests
        run: dotnet test --filter "Category!=Live"
